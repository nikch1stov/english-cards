<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English Cards</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Карточки">
  <meta name="theme-color" content="#f5f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png?v=3">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main id="app"><p class="loading">Загрузка…</p></main>
  <nav id="tabs" aria-label="Разделы">
    <label role="button" data-go="mistakes">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9M4 13a8 8 0 0 0 14.3 4.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M5.5 2.8v3.6h3.6M18.5 21.2v-3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="mistakes-badge" class="tab-badge" hidden></span>
      </span>
      Ошибки
    </label>
    <label role="button" data-go="dict">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M5 20.5A2.5 2.5 0 0 0 7.5 23H19v-5M9 7.5h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      Словарь
    </label>
    <label role="button" data-go="home" class="tab-main">
      <span class="tab-fab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="13" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3h9.5A3 3 0 0 1 20.5 6v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      Учить
    </label>
    <label role="button" data-go="stats">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M12 20V5M19 20v-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      Статистика
    </label>
    <label role="button" data-go="settings">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      Профиль
    </label>
  </nav>
  <script type="module" src="app.js?v=15"></script>
</body>
</html>
